name: News service checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Core and API tests
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --features http --bin lazybuddy-news-http
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B scripts/verify/test-news-http.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
